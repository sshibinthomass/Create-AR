[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-converter-backend"
version = "1.0.0"
description = "Blender-backed 3D model conversion service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # cascadio needs numpy at runtime but does not declare it, so a clean
    # install silently loses STEP/IGES support. Pinned here deliberately.
    "numpy>=1.24",
    "cascadio>=0.1.1",
    "py7zr>=0.20",
    # Naming parts from their renders. Which one is used is a setting; both
    # are installed so switching provider needs no reinstall.
    "openai>=1.40",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["blender_job.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
